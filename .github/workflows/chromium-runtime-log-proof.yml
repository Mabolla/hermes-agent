name: Real Windows Chromium payload verification
on:
  push:
    branches: [ci/chromium-runtime-log-proof]
    paths: [.github/workflows/chromium-runtime-log-proof.yml]
permissions:
  contents: read
jobs:
  chromium-payload:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7
        with:
          ref: 44d8847a06288f1f74978fa113d6075c799f898b
          fetch-depth: 2
          persist-credentials: false
      - uses: ./.github/actions/setup-pm
        with:
          toolchain: python
          test-environment: 'true'
          packages: chromium
      - name: Verify pinned archive, live log lock and payload damage
        run: |
          "$HERMES_PYTHON" - <<'PY' 2>&1 | tee "$RUNNER_TEMP/real-chromium-payload.log"
          import ctypes
          from ctypes import wintypes
          from pm.registry import get_package
          from pm.install import _entry_verified, _installed_location, _lockfile
          from pm.store import current_target, tree_digest
          package, target = get_package("chromium"), current_target()
          facts, store = _installed_location(package, _lockfile(), target)
          fact = facts.get("chromium")
          entry = store.entry(fact["entry"])
          assert package.verify(entry, target) == ""
          assert tree_digest(entry) == fact["digest"]
          assert _entry_verified(package, fact, store, target)
          log = entry / "chrome-win64" / "debug.log"
          log.write_bytes(b"runtime crashpad registration diagnostic\n")
          kernel = ctypes.WinDLL("kernel32", use_last_error=True)
          kernel.CreateFileW.argtypes = [wintypes.LPCWSTR, wintypes.DWORD, wintypes.DWORD,
              wintypes.LPVOID, wintypes.DWORD, wintypes.DWORD, wintypes.HANDLE]
          kernel.CreateFileW.restype = wintypes.HANDLE
          kernel.CloseHandle.argtypes = [wintypes.HANDLE]
          handle = kernel.CreateFileW(str(log), 0x40000000, 3, None, 3, 0x80, None)
          assert handle != wintypes.HANDLE(-1).value, ctypes.get_last_error()
          try:
              try:
                  log.unlink()
              except PermissionError:
                  pass
              else:
                  raise AssertionError("Windows did not hold the log against deletion")
              assert tree_digest(entry) != fact["digest"], "old raw digest must see the log"
              assert _entry_verified(package, fact, store, target)
              resource = next(entry.rglob("*.pak"))
              with resource.open("ab") as output:
                  output.write(b"tampered payload")
              assert not _entry_verified(package, fact, store, target)
          finally:
              kernel.CloseHandle(handle)
          print("Actual pinned Chromium archive:", fact["version"], target)
          print("Old raw digest rejects the runtime log; package verification accepts it.")
          print("Native Windows log deletion is refused; the log is preserved.")
          print("Modified .pak payload is rejected.")
          print("Browser rendering is not claimed by this payload verification.")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: real-windows-chromium-payload
          path: ${{ runner.temp }}/real-chromium-payload.log
          retention-days: 7
